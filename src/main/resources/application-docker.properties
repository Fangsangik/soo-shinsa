# 🐳 Docker 환경 전용 설정
spring.application.name=SooShinsa

# 데이터베이스 설정 (Docker 컨테이너 연결)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-init-sql=SET NAMES utf8mb4
# 미설정 시 기본값 10. Tomcat 스레드는 200이라 병목 지점이 되므로 명시해 둔다.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# JPA 설정 (프로덕션 최적화)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=false
jpa.properties.hibernate.auto_quote_keyword=true

# JWT 설정
jwt.secret=${JWT_SECRET}
jwt.expiry-millis=${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
jwt.refresh-expiry-millis=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

# Redis 설정 (Docker 컨테이너 연결)
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

# AWS 설정
cloud.aws.credentials.accessKey=${AWS_ACCESS_KEY}
cloud.aws.credentials.secretKey=${AWS_SECRET_KEY}
cloud.aws.s3.region=${AWS_REGION}
cloud.aws.s3.bucket=${AWS_S3_BUCKET}

# Toss Payments 설정
toss.secret_api_key=${TOSS_SECRET_KEY}
toss.client_api_key=${TOSS_CLIENT_KEY}
toss.success_url=${TOSS_ORIGIN_URL}/api/v1/payments/toss/success
toss.fail_url=${TOSS_ORIGIN_URL}/api/v1/payments/toss/fail
toss.base-url=https://api.tosspayments.com/v1

# Kakao OAuth 설정
kakao.client_id=${KAKAO_CLIENT_ID}
kakao.redirect_uri=${TOSS_ORIGIN_URL}/callback
kakao.client_secret=${KAKAO_CLIENT_SECRET}
kakao.token_uri=https://kauth.kakao.com/oauth/token
kakao.user_info_uri=https://kapi.kakao.com/v2/user/me

# CORS 설정
cors.allowed-origins=${ALLOWED_ORIGINS}

# 로깅 설정 (컨테이너 환경 최적화)
logging.level.com.Soo_Shinsa=INFO
logging.level.org.springframework.cache=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.file.name=/app/logs/sooshinsa.log
logging.logback.rollingpolicy.max-file-size=100MB
logging.logback.rollingpolicy.total-size-cap=1GB

# Actuator 설정 (모니터링)
# 외부에 열리는 엔드포인트는 최소로. prometheus 는 내부망에서만 켠다
# 컨테이너 네트워크 내부에서 Prometheus 가 스크랩하므로 여기서는 열어둔다
management.endpoints.web.exposure.include=${ACTUATOR_ENDPOINTS:health,info,metrics,prometheus}
management.endpoint.health.show-details=${ACTUATOR_HEALTH_DETAILS:never}
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=soo-shinsa

# Spring Batch 설정
spring.batch.job.enabled=true
spring.batch.jdbc.initialize-schema=never

# MyBatis 설정
mybatis.mapper-locations=classpath:mappers/*.xml

# 정적 리소스 설정
spring.mvc.static-path-pattern=/**
spring.web.resources.static-locations=classpath:/static/

# Swagger 설정
springdoc.swagger-ui.oauth2-redirect-url=${TOSS_ORIGIN_URL}/callback
springdoc.swagger-ui.use-root-path=true

# Tomcat 설정 (컨테이너 환경 최적화)
server.tomcat.max-threads=200
server.tomcat.max-connections=8192
server.tomcat.keep-alive-timeout=60000
server.tomcat.connection-timeout=20000
server.tomcat.accept-count=100

# 컨테이너 환경 최적화
server.forward-headers-strategy=native
server.use-forward-headers=true

# 시드 데이터는 운영/도커에서 비활성화
app.seed.enabled=false

# 미결제 주문 정리 (주문 시 재고를 차감하므로 결제 안 하면 되돌려야 한다)
app.order.pending-timeout=${ORDER_PENDING_TIMEOUT:PT30M}
app.order.pending-sweep-interval=${ORDER_SWEEP_INTERVAL:PT1M}
app.order.pending-sweep-batch-size=${ORDER_SWEEP_BATCH:100}

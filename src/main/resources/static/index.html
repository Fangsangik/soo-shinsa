<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>無shinsa</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%23111%27/%3E%3Ctext x=%2716%27 y=%2722%27 text-anchor=%27middle%27 font-size=%2718%27 font-weight=%27700%27 fill=%27%23fff%27 font-family=%27sans-serif%27%3E無%3C/text%3E%3C/svg%3E"/>
    <link rel="stylesheet" href="/app.css"/>
</head>
<body>
<div id="loading" class="loading" hidden></div>
<header class="topbar">
    <a href="#/" class="logo">無shinsa</a>
    <nav id="nav"></nav>
</header>
<main id="app" class="container"></main>
<div id="toast" class="toast" hidden></div>
<button id="chat-fab" class="chat-fab" aria-label="상담 채팅" hidden>💬</button>
<section id="chat-panel" class="chat-panel" hidden>
    <div class="chat-head"><strong id="chat-title">상담</strong><select id="chat-room" class="sm"></select><button id="chat-close" class="btn sm ghost">닫기</button></div>
    <div id="chat-messages" class="chat-messages"></div>
    <div class="chat-input-row"><input id="chat-input" placeholder="메시지 입력 후 Enter" maxlength="1000"><button id="chat-send" class="btn sm primary">전송</button></div>
</section>
<dialog id="modal"></dialog>
<script src="/app.js"></script>
</body>
</html>

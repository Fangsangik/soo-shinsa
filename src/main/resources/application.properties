spring.application.name=Soo-Shinsa

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/soo_shinsa}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}

spring.mvc.hiddenmethod.filter.enabled=true

# 스키마는 Flyway 가 만든다. Hibernate 는 엔티티와 어긋나는지 확인만 한다.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.flyway.enabled=${FLYWAY_ENABLED:true}
# ddl-auto=update 로 이미 만들어진 DB 는 V1 을 다시 돌리지 않고 baseline 으로 표시한다
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
jwt.secret=${JWT_SECRET:please_change_this_secret_key_for_jwt_security_minimum_256_bits_required}
jwt.expiry-millis=${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
jwt.refresh-expiry-millis=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

# 로컬/데모용 시드 데이터 (상품이 비어 있을 때만 생성). 운영에서는 false
app.seed.enabled=${SEED_DATA:true}

# Admin 계정 생성용 특별 키 (환경변수로 관리 권장)
app.admin.secret-key=${ADMIN_SECRET_KEY:SooShinsa_Admin_Secret_2025_SuperSecure!}

# ?? ?? ?? (Redis ?? ?? ???)
logging.level.org.springframework.cache=trace

cloud.aws.credentials.accessKey=${AWS_ACCESS_KEY:your_access_key}
cloud.aws.credentials.secretKey=${AWS_SECRET_KEY:your_secret_key}
cloud.aws.s3.region=${AWS_REGION:ap-northeast-2}
cloud.aws.s3.bucket=${AWS_S3_BUCKET:your-bucket}

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# UTF-8 \uC124\uC815
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-init-sql=SET NAMES utf8mb4
# 미설정 시 기본값 10. Tomcat 스레드는 200이라 병목 지점이 되므로 명시해 둔다.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

jpa.properties.hibernate.auto_quote_keyword=true

# Spring Batch Job enable
spring.batch.job.enabled=true
spring.batch.jdbc.initialize-schema=${BATCH_INIT_SCHEMA:never}

spring.mvc.static-path-pattern=/**
spring.web.resources.static-locations=classpath:/static/

#mybatis
mybatis.mapper-locations=classpath:mappers/*.xml

springdoc.swagger-ui.oauth2-redirect-url=http://localhost:8080/callback
springdoc.swagger-ui.use-root-path=false
springdoc.swagger-ui.path=/swagger-ui.html


toss.secret_api_key=${TOSS_SECRET_KEY:test_sk_placeholder}
toss.client_api_key=${TOSS_CLIENT_KEY:test_ck_placeholder}
# 컨트롤러 실제 경로(@RequestMapping("/api") + /success)와 맞춘다
toss.success_url=${TOSS_ORIGIN_URL:http://localhost:8080}/api/success
toss.fail_url=${TOSS_ORIGIN_URL:http://localhost:8080}/api/fail
toss.base-url=https://api.tosspayments.com/v1

kakao.client_id=${KAKAO_CLIENT_ID:your_client_id}
kakao.redirect_uri=${KAKAO_REDIRECT_URI:http://localhost:8080/callback}
kakao.client_secret=${KAKAO_CLIENT_SECRET:your_client_secret}
kakao.token_uri=https://kauth.kakao.com/oauth/token
kakao.user_info_uri=https://kapi.kakao.com/v2/user/me

server.tomcat.max-threads=200
server.tomcat.max-connections=200
server.tomcat.keep-alive-timeout=60000
server.tomcat.connection-timeout=60000

# Actuator & Prometheus Metrics
# 외부에 열리는 엔드포인트는 최소로. prometheus 는 내부망에서만 켠다
management.endpoints.web.exposure.include=${ACTUATOR_ENDPOINTS:health,info}
management.endpoint.health.show-details=${ACTUATOR_HEALTH_DETAILS:never}
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=soo-shinsa

# 미결제 주문 정리 (주문 시 재고를 차감하므로 결제 안 하면 되돌려야 한다)
app.order.pending-timeout=${ORDER_PENDING_TIMEOUT:PT30M}
app.order.pending-sweep-interval=${ORDER_SWEEP_INTERVAL:PT1M}
app.order.pending-sweep-batch-size=${ORDER_SWEEP_BATCH:100}

spring.application.name=Soo-Shinsa

# 🔒 보안 강화: 모든 민감 정보를 환경변수로 관리
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/soo_shinsa}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.mvc.hiddenmethod.filter.enabled=true

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# JWT 보안 설정 (환경변수 필수)
jwt.secret=${JWT_SECRET}
jwt.expiry-millis=${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
jwt.refresh-expiry-millis=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

# 캐싱 로깅 (Redis 성능 모니터링용)
logging.level.org.springframework.cache=trace

# AWS 설정 (환경변수 필수)
cloud.aws.credentials.accessKey=${AWS_ACCESS_KEY}
cloud.aws.credentials.secretKey=${AWS_SECRET_KEY}
cloud.aws.s3.region=${AWS_REGION:ap-northeast-2}
cloud.aws.s3.bucket=${AWS_S3_BUCKET}

# Redis 설정
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# UTF-8 설정
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-init-sql=SET NAMES utf8mb4
# 미설정 시 기본값 10. Tomcat 스레드는 200이라 병목 지점이 되므로 명시해 둔다.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

jpa.properties.hibernate.auto_quote_keyword=true

# Spring Batch Job enable
spring.batch.job.enabled=true
spring.batch.jdbc.initialize-schema=${BATCH_INIT_SCHEMA:always}

spring.mvc.static-path-pattern=/**
spring.web.resources.static-locations=classpath:/static/

# MyBatis 설정
mybatis.mapper-locations=classpath:mappers/*.xml

# Swagger 설정
springdoc.swagger-ui.oauth2-redirect-url=${TOSS_ORIGIN_URL:http://localhost:8080}/callback
springdoc.swagger-ui.use-root-path=true

# Toss Payments 설정 (환경변수 필수)
toss.secret_api_key=${TOSS_SECRET_KEY}
toss.client_api_key=${TOSS_CLIENT_KEY}
toss.success_url=${TOSS_ORIGIN_URL:http://localhost:8080}/api/v1/payments/toss/success
toss.fail_url=${TOSS_ORIGIN_URL:http://localhost:8080}/api/v1/payments/toss/fail
toss.base-url=https://api.tosspayments.com/v1

# Kakao OAuth 설정 (환경변수 필수)
kakao.client_id=${KAKAO_CLIENT_ID}
kakao.redirect_uri=${TOSS_ORIGIN_URL:http://localhost:8080}/callback
kakao.client_secret=${KAKAO_CLIENT_SECRET}
kakao.token_uri=https://kauth.kakao.com/oauth/token
kakao.user_info_uri=https://kapi.kakao.com/v2/user/me

# Tomcat 성능 튜닝
server.tomcat.max-threads=200
server.tomcat.max-connections=200
server.tomcat.keep-alive-timeout=60000
server.tomcat.connection-timeout=60000
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  # - "first_rules.yml"

scrape_configs:
  # SooShinsa Spring Boot 애플리케이션
  - job_name: 'soo-shinsa'
    static_configs:
      - targets: ['host.docker.internal:8080']
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s

  # 시스템 메트릭 (Node Exporter)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 5s

  # Prometheus 자체 모니터링
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 5s

  # MySQL 메트릭 (옵션)
  - job_name: 'mysql'
    static_configs:
      - targets: ['host.docker.internal:3306']
    scrape_interval: 10s
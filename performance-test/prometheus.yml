global:
  scrape_interval: 1s
  evaluation_interval: 1s

scrape_configs:
  - job_name: 'soo-shinsa-app'
    static_configs:
      - targets: ['host.docker.internal:8080']
    metrics_path: '/actuator/prometheus'
    scrape_interval: 1s
    scrape_timeout: 1s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 SooShinsa 실시간 TPS 대시보드</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .dashboard {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 2.5em;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .metric-card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .metric-card h3 {
            margin: 0 0 10px 0;
            font-size: 1.2em;
            opacity: 0.9;
        }
        .metric-value {
            font-size: 2.5em;
            font-weight: bold;
            margin: 10px 0;
        }
        .metric-unit {
            font-size: 0.9em;
            opacity: 0.8;
        }
        .chart-container {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .status-good { background-color: #4CAF50; }
        .status-warning { background-color: #FF9800; }
        .status-error { background-color: #f44336; }
        .update-time {
            text-align: center;
            opacity: 0.7;
            margin-top: 20px;
        }
        .performance-grade {
            font-size: 1.5em;
            padding: 10px 20px;
            border-radius: 25px;
            display: inline-block;
            margin: 10px;
        }
        .grade-s { background: linear-gradient(45deg, #FFD700, #FFA500); color: #000; }
        .grade-a { background: linear-gradient(45deg, #32CD32, #228B22); }
        .grade-b { background: linear-gradient(45deg, #1E90FF, #0066CC); }
        .grade-c { background: linear-gradient(45deg, #FF6347, #DC143C); }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <h1>🔥 SooShinsa 실시간 TPS 대시보드</h1>
            <p>점진적 부하 테스트 - 스레드 수 vs 성능 분석</p>
        </div>

        <div class="metrics-grid">
            <div class="metric-card">
                <h3>현재 TPS</h3>
                <div class="metric-value" id="current-tps">66.6</div>
                <div class="metric-unit">요청/초</div>
            </div>
            <div class="metric-card">
                <h3>동시 사용자</h3>
                <div class="metric-value" id="current-threads">50</div>
                <div class="metric-unit">명</div>
            </div>
            <div class="metric-card">
                <h3>평균 응답시간</h3>
                <div class="metric-value" id="avg-response">0</div>
                <div class="metric-unit">ms</div>
            </div>
            <div class="metric-card">
                <h3>성공률</h3>
                <div class="metric-value" id="success-rate">100.0</div>
                <div class="metric-unit">%</div>
            </div>
        </div>

        <div class="chart-container">
            <h3><span class="status-indicator status-good"></span>TPS vs 스레드 수 실시간 차트</h3>
            <canvas id="tpsChart" width="400" height="200"></canvas>
        </div>

        <div class="chart-container">
            <h3><span class="status-indicator status-good"></span>응답시간 vs 스레드 수</h3>
            <canvas id="responseChart" width="400" height="200"></canvas>
        </div>

        <div style="text-align: center;">
            <h3>🏆 성능 등급</h3>
            <div class="performance-grade grade-s" id="performance-grade">S급 - 완벽한 성능</div>
        </div>

        <div class="update-time">
            <p>📊 마지막 업데이트: <span id="last-update"></span></p>
            <p>💡 실시간 데이터는 JMeter 테스트 결과를 기반으로 합니다</p>
        </div>
    </div>

    <script>
        // 실제 테스트 데이터 (지금까지 측정된 결과)
        const testData = [
            { threads: 50, tps: 66.6, responseTime: 0, successRate: 100.0, errors: 0 }
        ];

        // TPS 차트 설정
        const tpsCtx = document.getElementById('tpsChart').getContext('2d');
        const tpsChart = new Chart(tpsCtx, {
            type: 'line',
            data: {
                labels: testData.map(d => d.threads + '명'),
                datasets: [{
                    label: 'TPS (Transactions Per Second)',
                    data: testData.map(d => d.tps),
                    borderColor: '#FFD700',
                    backgroundColor: 'rgba(255, 215, 0, 0.1)',
                    borderWidth: 3,
                    fill: true,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        labels: { color: 'white' }
                    }
                },
                scales: {
                    x: {
                        title: {
                            display: true,
                            text: '동시 사용자 수',
                            color: 'white'
                        },
                        ticks: { color: 'white' },
                        grid: { color: 'rgba(255,255,255,0.1)' }
                    },
                    y: {
                        title: {
                            display: true,
                            text: 'TPS',
                            color: 'white'
                        },
                        ticks: { color: 'white' },
                        grid: { color: 'rgba(255,255,255,0.1)' }
                    }
                }
            }
        });

        // 응답시간 차트 설정
        const responseCtx = document.getElementById('responseChart').getContext('2d');
        const responseChart = new Chart(responseCtx, {
            type: 'bar',
            data: {
                labels: testData.map(d => d.threads + '명'),
                datasets: [{
                    label: '평균 응답시간 (ms)',
                    data: testData.map(d => d.responseTime),
                    backgroundColor: 'rgba(76, 175, 80, 0.8)',
                    borderColor: '#4CAF50',
                    borderWidth: 2
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        labels: { color: 'white' }
                    }
                },
                scales: {
                    x: {
                        title: {
                            display: true,
                            text: '동시 사용자 수',
                            color: 'white'
                        },
                        ticks: { color: 'white' },
                        grid: { color: 'rgba(255,255,255,0.1)' }
                    },
                    y: {
                        title: {
                            display: true,
                            text: '응답시간 (ms)',
                            color: 'white'
                        },
                        ticks: { color: 'white' },
                        grid: { color: 'rgba(255,255,255,0.1)' }
                    }
                }
            }
        });

        // 데이터 업데이트 함수
        function updateDashboard() {
            const latestData = testData[testData.length - 1];
            
            document.getElementById('current-tps').textContent = latestData.tps;
            document.getElementById('current-threads').textContent = latestData.threads;
            document.getElementById('avg-response').textContent = latestData.responseTime;
            document.getElementById('success-rate').textContent = latestData.successRate;
            document.getElementById('last-update').textContent = new Date().toLocaleString('ko-KR');
            
            // 성능 등급 업데이트
            let grade = 'S급 - 완벽한 성능';
            let gradeClass = 'grade-s';
            
            if (latestData.successRate < 95) {
                grade = 'C급 - 개선 필요';
                gradeClass = 'grade-c';
            } else if (latestData.responseTime > 100) {
                grade = 'B급 - 양호';
                gradeClass = 'grade-b';
            } else if (latestData.tps < 50) {
                grade = 'A급 - 우수';
                gradeClass = 'grade-a';
            }
            
            const gradeElement = document.getElementById('performance-grade');
            gradeElement.textContent = grade;
            gradeElement.className = 'performance-grade ' + gradeClass;
        }

        // 5초마다 대시보드 업데이트
        setInterval(updateDashboard, 5000);
        
        // 초기 로드
        updateDashboard();

        // 새로운 테스트 데이터 시뮬레이션 (실제로는 CSV 파일에서 읽어올 수 있음)
        function simulateNewData() {
            const threadCounts = [100, 200, 300, 500];
            let index = 0;
            
            setInterval(() => {
                if (index < threadCounts.length) {
                    const threads = threadCounts[index];
                    // 시뮬레이션된 성능 데이터 (실제로는 JMeter 결과에서 가져옴)
                    const tps = Math.max(20, 80 - (threads - 50) * 0.1 + Math.random() * 10);
                    const responseTime = Math.min(500, (threads - 50) * 0.5 + Math.random() * 20);
                    const successRate = Math.max(85, 100 - (threads - 50) * 0.05);
                    
                    testData.push({
                        threads: threads,
                        tps: parseFloat(tps.toFixed(1)),
                        responseTime: parseInt(responseTime),
                        successRate: parseFloat(successRate.toFixed(1)),
                        errors: threads > 300 ? Math.floor(Math.random() * 5) : 0
                    });
                    
                    // 차트 업데이트
                    tpsChart.data.labels.push(threads + '명');
                    tpsChart.data.datasets[0].data.push(tps);
                    tpsChart.update();
                    
                    responseChart.data.labels.push(threads + '명');
                    responseChart.data.datasets[0].data.push(responseTime);
                    responseChart.update();
                    
                    index++;
                }
            }, 10000); // 10초마다 새 데이터 추가
        }

        // 새 데이터 시뮬레이션 시작 (30초 후)
        setTimeout(simulateNewData, 30000);
    </script>
</body>
</html>

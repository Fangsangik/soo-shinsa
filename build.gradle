plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '3.3.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    //jpa
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    implementation("org.springdoc:springdoc-openapi-starter-webmvc-ui:2.1.0")

    implementation 'org.springframework.boot:spring-boot-starter-webflux:3.4.1'
    implementation 'org.springframework.boot:spring-boot-starter-websocket:3.4.1'

    //redisson
    implementation 'org.redisson:redisson-spring-boot-starter:3.22.1'

    //redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // Spring Batch
    implementation 'org.springframework.boot:spring-boot-starter-batch'

    // Quartz (스케줄링)
    implementation 'org.springframework.boot:spring-boot-starter-quartz'

    implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    annotationProcessor "com.querydsl:querydsl-apt:5.0.0:jakarta"
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"

    //web
    implementation 'org.springframework.boot:spring-boot-starter-web'
    //lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    //mysql
    runtimeOnly 'com.mysql:mysql-connector-j'

    // 스키마 마이그레이션. ddl-auto 대신 버전 관리된 SQL 로 스키마를 만든다
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    //security
    implementation 'org.springframework.boot:spring-boot-starter-security'

    //jwt
    compileOnly 'io.jsonwebtoken:jjwt-api:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'

    //validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Monitoring & Metrics (Prometheus, Grafana)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // aws
    implementation 'org.springframework.cloud:spring-cloud-starter-aws:2.2.6.RELEASE'
    // Spring Batch
    implementation 'org.springframework.boot:spring-boot-starter-batch'

    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    //mybatis
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.4'
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:3.0.4'
    // 테스트를 개발 DB 가 아닌 일회용 컨테이너에서 돌린다
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
    // @SpringBootTest 도 ApplicationRunner 를 실행하므로 테스트 DB에 시드가 섞이지 않게 막는다
    systemProperty 'app.seed.enabled', 'false'
    // 스케줄러가 테스트 중 주문을 취소해버리지 않도록 끈다
    systemProperty 'app.order.pending-sweep-enabled', 'false'
}

// 프론트엔드 개발용 파일은 jar에 넣지 않는다 (13MB node_modules가 /node_modules/** 로 공개 서빙되던 문제)
tasks.named('processResources') {
    exclude 'static/node_modules/**', 'static/package.json', 'static/package-lock.json', 'static/**/*.log'
}

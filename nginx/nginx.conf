# 🌐 SooShinsa Nginx 리버스 프록시 설정
# 무중단 배포 및 로드밸런싱 지원

events {
    worker_connections 1024;
}

http {
    # 기본 설정
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    # 로그 형식
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;
    
    # 성능 최적화
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    
    # Gzip 압축
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml+rss
        image/svg+xml;
    
    # 업스트림 서버 정의 (Blue-Green 배포용)
    upstream sooshinsa_backend {
        server app:8080 max_fails=3 fail_timeout=30s;
        # Blue-Green 배포 시 추가 서버
        # server app-blue:8080 max_fails=3 fail_timeout=30s backup;
    }
    
    # Rate Limiting 설정
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
    
    # 메인 서버 설정
    server {
        listen 80;
        server_name localhost sooshinsa.com;
        
        # 보안 헤더
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
        
        # 정적 파일 처리
        location /static/ {
            alias /app/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        # 헬스체크 엔드포인트
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
        
        # API 엔드포인트 (Rate Limiting 적용)
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://sooshinsa_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # 타임아웃 설정
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            
            # 버퍼 설정
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }
        
        # 인증 엔드포인트 (더 엄격한 Rate Limiting)
        location ~ ^/(users/login|users/signin|oauth2) {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://sooshinsa_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # WebSocket 연결
        location /ws/ {
            proxy_pass http://sooshinsa_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket 타임아웃
            proxy_read_timeout 86400;
        }
        
        # 모니터링 엔드포인트 (내부 접근만 허용)
        location /actuator/ {
            allow 172.16.0.0/12;  # Docker 네트워크
            allow 127.0.0.1;      # 로컬호스트
            deny all;
            
            proxy_pass http://sooshinsa_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # 기본 프록시 설정
        location / {
            proxy_pass http://sooshinsa_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # 에러 페이지
            error_page 502 503 504 /50x.html;
        }
        
        # 에러 페이지
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
    
    # 모니터링 서버 (내부 접근용)
    server {
        listen 8081;
        server_name localhost;
        
        # Prometheus 메트릭
        location /metrics {
            allow 172.16.0.0/12;
            deny all;
            proxy_pass http://sooshinsa_backend/actuator/prometheus;
        }
        
        # Grafana 대시보드
        location /grafana/ {
            allow 172.16.0.0/12;
            deny all;
            proxy_pass http://grafana:3000/;
        }
    }
}

# TCP/UDP 로드밸런싱 (필요시)

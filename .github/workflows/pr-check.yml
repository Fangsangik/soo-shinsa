# 🔍 Pull Request 검증 워크플로우
name: PR Check

on:
  pull_request:
    branches: [ main, develop ]
    types: [ opened, synchronize, reopened ]

jobs:
  # PR 정보 분석
  pr-analysis:
    name: 📋 PR Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 체크아웃
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 전체 히스토리 가져오기
        
    - name: 📊 변경사항 분석
      id: changes
      run: |
        # 변경된 파일 유형 분석
        changed_files=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }})
        
        # Java 파일 변경 여부
        if echo "$changed_files" | grep -q "\.java$"; then
          echo "java_changed=true" >> $GITHUB_OUTPUT
        fi
        
        # 설정 파일 변경 여부
        if echo "$changed_files" | grep -qE "\.(properties|yml|yaml)$"; then
          echo "config_changed=true" >> $GITHUB_OUTPUT
        fi
        
        # Docker 파일 변경 여부
        if echo "$changed_files" | grep -qE "(Dockerfile|docker-compose)"; then
          echo "docker_changed=true" >> $GITHUB_OUTPUT
        fi
        
        # 테스트 파일 변경 여부
        if echo "$changed_files" | grep -q "src/test/"; then
          echo "test_changed=true" >> $GITHUB_OUTPUT
        fi
        
        echo "변경된 파일:"
        echo "$changed_files"
        
    outputs:
      java_changed: ${{ steps.changes.outputs.java_changed }}
      config_changed: ${{ steps.changes.outputs.config_changed }}
      docker_changed: ${{ steps.changes.outputs.docker_changed }}
      test_changed: ${{ steps.changes.outputs.test_changed }}

  # 빠른 검증 (Java 파일 변경 시에만)
  quick-check:
    name: ⚡ Quick Check
    runs-on: ubuntu-latest
    needs: pr-analysis
    if: needs.pr-analysis.outputs.java_changed == 'true'
    
    steps:
    - name: 📥 체크아웃
      uses: actions/checkout@v4
      
    - name: ☕ Java 21 설정
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: 📊 Gradle 캐시
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        
    - name: 🛠️ Gradle 빌드 권한 설정
      run: chmod +x ./gradlew
      
    - name: 🏗️ 컴파일 검사
      run: ./gradlew compileJava compileTestJava
      
    - name: 🔍 코드 스타일 검사
      run: ./gradlew checkstyleMain
      
    - name: 📊 정적 분석
      run: ./gradlew spotbugsMain
      continue-on-error: true

  # 테스트 실행 (테스트 파일 변경 시)
  test-check:
    name: 🧪 Test Check
    runs-on: ubuntu-latest
    needs: pr-analysis
    if: needs.pr-analysis.outputs.test_changed == 'true' || needs.pr-analysis.outputs.java_changed == 'true'
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test123
          MYSQL_DATABASE: soo_shinsa_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    
    steps:
    - name: 📥 체크아웃
      uses: actions/checkout@v4
      
    - name: ☕ Java 21 설정
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: 📊 Gradle 캐시
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        
    - name: 🛠️ Gradle 빌드 권한 설정
      run: chmod +x ./gradlew
      
    - name: 🧪 단위 테스트 실행
      run: ./gradlew test
      env:
        SPRING_PROFILES_ACTIVE: test
        DB_URL: jdbc:mysql://localhost:3306/soo_shinsa_test
        DB_USERNAME: root
        DB_PASSWORD: test123
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        JWT_SECRET: test_jwt_secret_key_for_testing_minimum_32_characters

  # Docker 검증 (Docker 파일 변경 시)
  docker-check:
    name: 🐳 Docker Check
    runs-on: ubuntu-latest
    needs: pr-analysis
    if: needs.pr-analysis.outputs.docker_changed == 'true'
    
    steps:
    - name: 📥 체크아웃
      uses: actions/checkout@v4
      
    - name: 🐳 Docker Buildx 설정
      uses: docker/setup-buildx-action@v3
      
    - name: 🏗️ Docker 빌드 테스트
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: sooshinsa:pr-${{ github.event.number }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # 보안 스캔
  security-check:
    name: 🛡️ Security Check
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 체크아웃
      uses: actions/checkout@v4
      
    - name: 🔍 시크릿 스캔
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: ${{ github.event.repository.default_branch }}
        head: HEAD
        
    - name: 🛡️ 취약점 스캔
      uses: github/codeql-action/analyze@v3
      with:
        languages: java

  # PR 코멘트 (결과 요약)
  pr-comment:
    name: 💬 PR Comment
    runs-on: ubuntu-latest
    needs: [pr-analysis, quick-check, test-check, docker-check, security-check]
    if: always()
    
    steps:
    - name: 💬 검증 결과 코멘트
      uses: actions/github-script@v7
      with:
        script: |
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          
          const botComment = comments.find(comment => 
            comment.user.type === 'Bot' && comment.body.includes('🔍 PR 검증 결과')
          );
          
          const results = {
            'quick-check': '${{ needs.quick-check.result }}',
            'test-check': '${{ needs.test-check.result }}',
            'docker-check': '${{ needs.docker-check.result }}',
            'security-check': '${{ needs.security-check.result }}'
          };
          
          let status = '✅';
          let summary = '모든 검사를 통과했습니다!';
          
          for (const [check, result] of Object.entries(results)) {
            if (result === 'failure') {
              status = '❌';
              summary = '일부 검사에서 실패했습니다.';
              break;
            } else if (result === 'cancelled') {
              status = '⏸️';
              summary = '일부 검사가 취소되었습니다.';
            }
          }
          
          const body = `## 🔍 PR 검증 결과 ${status}
          
**요약**: ${summary}

### 📊 검사 결과
| 검사 항목 | 결과 | 상태 |
|----------|------|------|
| ⚡ 빠른 검사 | ${results['quick-check'] || 'skipped'} | ${results['quick-check'] === 'success' ? '✅' : results['quick-check'] === 'failure' ? '❌' : '⏭️'} |
| 🧪 테스트 | ${results['test-check'] || 'skipped'} | ${results['test-check'] === 'success' ? '✅' : results['test-check'] === 'failure' ? '❌' : '⏭️'} |
| 🐳 Docker | ${results['docker-check'] || 'skipped'} | ${results['docker-check'] === 'success' ? '✅' : results['docker-check'] === 'failure' ? '❌' : '⏭️'} |
| 🛡️ 보안 | ${results['security-check']} | ${results['security-check'] === 'success' ? '✅' : '❌'} |

### 📋 변경사항 분석
- Java 파일: ${{ needs.pr-analysis.outputs.java_changed == 'true' && '🔄 변경됨' || '➡️ 변경없음' }}
- 설정 파일: ${{ needs.pr-analysis.outputs.config_changed == 'true' && '🔄 변경됨' || '➡️ 변경없음' }}
- Docker 파일: ${{ needs.pr-analysis.outputs.docker_changed == 'true' && '🔄 변경됨' || '➡️ 변경없음' }}
- 테스트 파일: ${{ needs.pr-analysis.outputs.test_changed == 'true' && '🔄 변경됨' || '➡️ 변경없음' }}

---
*🤖 자동 생성된 코멘트입니다. 문제가 있다면 [워크플로우](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})를 확인해주세요.*`;
          
          if (botComment) {
            github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body: body
            });
          } else {
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
          }
# 🚀 SooShinsa CI/CD 파이프라인
# 브랜치별 자동 빌드, 테스트, 배포

name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ published ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 1단계: 코드 품질 검사
  code-quality:
    name: 🔍 Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 체크아웃
      uses: actions/checkout@v4
      
    - name: ☕ Java 21 설정
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: 📊 Gradle 캐시
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: 🛠️ Gradle 빌드 권한 설정
      run: chmod +x ./gradlew
      
    - name: 🔍 코드 스타일 검사
      run: ./gradlew checkstyleMain checkstyleTest
      
    - name: 📊 정적 분석 (SpotBugs)
      run: ./gradlew spotbugsMain
      continue-on-error: true

  # 2단계: 빌드 및 테스트
  build-and-test:
    name: 🏗️ Build & Test
    runs-on: ubuntu-latest
    needs: code-quality
    
    # MySQL / Redis 는 Testcontainers 가 테스트 실행 중에 직접 띄운다.
    # (ubuntu-latest 러너에는 Docker 가 이미 있다)

    steps:
    - name: 📥 체크아웃
      uses: actions/checkout@v4
      
    - name: ☕ Java 21 설정
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: 📊 Gradle 캐시
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: 🛠️ Gradle 빌드 권한 설정
      run: chmod +x ./gradlew
      
    - name: 🏗️ 애플리케이션 빌드
      run: ./gradlew build -x test
      env:
        SPRING_PROFILES_ACTIVE: test
        
    - name: 🧪 테스트 실행
      # 접속 정보는 Testcontainers 가 주입하므로 DB/Redis 환경변수가 필요 없다
      run: ./gradlew test
        JWT_SECRET: test_jwt_secret_key_for_testing_minimum_32_characters
        
    - name: 📊 테스트 결과 업로드
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: build/reports/tests/test/
        
    - name: 📈 테스트 커버리지 (JaCoCo)
      run: ./gradlew jacocoTestReport
      
    - name: 📋 빌드 아티팩트 업로드
      uses: actions/upload-artifact@v4
      with:
        name: jar-artifact
        path: build/libs/*.jar

  # 3단계: 보안 스캔
  security-scan:
    name: 🛡️ Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: 📥 체크아웃
      uses: actions/checkout@v4
      
    - name: 🔍 의존성 취약점 스캔
      uses: github/codeql-action/analyze@v3
      with:
        languages: java
        
    - name: 🛡️ 시크릿 스캔
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: main
        head: HEAD

  # 4단계: Docker 이미지 빌드
  docker-build:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan]
    if: github.event_name != 'pull_request'
    
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.tags }}
    
    steps:
    - name: 📥 체크아웃
      uses: actions/checkout@v4
      
    - name: 🐳 Docker Buildx 설정
      uses: docker/setup-buildx-action@v3
      
    - name: 🔑 Container Registry 로그인
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: 📋 메타데이터 추출
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
          
    - name: 📥 빌드 아티팩트 다운로드
      uses: actions/download-artifact@v4
      with:
        name: jar-artifact
        path: build/libs/
        
    - name: 🏗️ Docker 이미지 빌드 및 푸시
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # 5단계: 개발 환경 배포
  deploy-dev:
    name: 🚀 Deploy to Development
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/develop'
    environment:
      name: development
      url: https://dev.sooshinsa.com
    
    steps:
    - name: 📥 체크아웃
      uses: actions/checkout@v4
      
    - name: 🚀 개발 서버 배포
      run: |
        echo "🚀 개발 환경 배포 시작"
        # 여기에 실제 배포 스크립트 추가
        # kubectl apply -f k8s/dev/ 또는
        # docker-compose -f docker-compose.dev.yml up -d
        
    - name: 🧪 배포 후 헬스체크
      run: |
        for i in {1..30}; do
          if curl -f https://dev.sooshinsa.com/actuator/health; then
            echo "✅ 개발 환경 배포 성공"
            exit 0
          fi
          echo "⏳ 서비스 시작 대기 중... ($i/30)"
          sleep 10
        done
        echo "❌ 개발 환경 배포 실패"
        exit 1

  # 6단계: 프로덕션 배포
  deploy-prod:
    name: 🏭 Deploy to Production
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    environment:
      name: production
      url: https://sooshinsa.com
    
    steps:
    - name: 📥 체크아웃
      uses: actions/checkout@v4
      
    - name: 🛡️ 프로덕션 배포 승인 대기
      uses: trstringer/manual-approval@v1
      with:
        secret: ${{ github.TOKEN }}
        approvers: ${{ github.actor }}
        minimum-approvals: 1
        issue-title: "🏭 프로덕션 배포 승인 요청"
        issue-body: |
          **배포 정보**
          - 브랜치: ${{ github.ref_name }}
          - 커밋: ${{ github.sha }}
          - 이미지: ${{ needs.docker-build.outputs.image-tag }}
          
          **변경사항**
          ${{ github.event.head_commit.message }}
          
          승인하시려면 이 이슈에 "approve" 댓글을 작성해주세요.
          
    - name: 🚀 Blue-Green 배포 실행
      run: |
        echo "🚀 프로덕션 Blue-Green 배포 시작"
        # Blue-Green 배포 스크립트 실행
        # ./scripts/blue-green-deploy.sh ${{ needs.docker-build.outputs.image-tag }}
        
    - name: 🧪 프로덕션 헬스체크
      run: |
        for i in {1..60}; do
          if curl -f https://sooshinsa.com/actuator/health; then
            echo "✅ 프로덕션 배포 성공"
            exit 0
          fi
          echo "⏳ 서비스 시작 대기 중... ($i/60)"
          sleep 10
        done
        echo "❌ 프로덕션 배포 실패"
        exit 1
        
    - name: 📱 배포 완료 알림
      if: success()
      uses: 8398a7/action-slack@v3
      with:
        status: success
        text: |
          🎉 프로덕션 배포 완료!
          - 브랜치: ${{ github.ref_name }}
          - 커밋: ${{ github.sha }}
          - URL: https://sooshinsa.com
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # 7단계: 성능 테스트 (프로덕션 배포 후)
  performance-test:
    name: ⚡ Performance Test
    runs-on: ubuntu-latest
    needs: deploy-prod
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: 📥 체크아웃
      uses: actions/checkout@v4
      
    - name: ☕ Java 21 설정 (JMeter)
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: 📊 JMeter 설치
      run: |
        wget -q https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
        tar -xzf apache-jmeter-5.6.3.tgz
        echo "JMETER_HOME=$(pwd)/apache-jmeter-5.6.3" >> $GITHUB_ENV
        echo "$(pwd)/apache-jmeter-5.6.3/bin" >> $GITHUB_PATH
        
    - name: ⚡ 성능 테스트 실행
      run: |
        cd performance-test
        jmeter -n -t coupon-stock-concurrency-test.jmx \
          -JSERVER_URL=https://sooshinsa.com \
          -JTHREADS=100 \
          -JDURATION=300 \
          -l results/prod-performance-test.jtl \
          > results/prod-performance.log
          
    - name: 📊 성능 테스트 결과 분석
      run: |
        cd performance-test
        # 성능 테스트 결과 분석 스크립트 실행
        if [ -f results/prod-performance-test.jtl ]; then
          success_rate=$(awk -F',' 'NR>1 && $8=="true" {success++} NR>1 {total++} END {print (success/total)*100}' results/prod-performance-test.jtl)
          echo "성공률: ${success_rate}%"
          if (( $(echo "${success_rate} < 99" | bc -l) )); then
            echo "❌ 성능 테스트 실패: 성공률이 99% 미만입니다"
            exit 1
          fi
        fi
        
    - name: 📈 성능 테스트 결과 업로드
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: performance-test-results
        path: performance-test/results/